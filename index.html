<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Listening Post</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; }
    /* interface text scales with the window height (D-008): 11 px on a 720p window, up to 22 px at 4K */
    #hud { position: fixed; left: 0.7em; top: 0.5em; color: #9a9; font: clamp(11px, 1.6vh, 22px)/1.3 monospace; pointer-events: none; }
    #device-notice { box-sizing: border-box; min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 24px; color: #c9c3b8; background: #050506; font: 17px/1.5 system-ui, sans-serif; text-align: center; }
    #device-notice h1 { font-size: 24px; letter-spacing: 0.08em; text-transform: uppercase; color: #e8e1d4; }
  </style>
</head>
<body>
  <div id="hud"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
